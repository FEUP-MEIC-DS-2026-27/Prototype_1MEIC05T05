services:
  workforce-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: workforce_db
    ports:
      - "5432:5432"
    volumes:
      - workforce_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d workforce_db"]
      interval: 5s
      retries: 10

  researcher-api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://admin:password@workforce-db:5432/workforce_db
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006
    ports:
      # 8001 on the host so this API can run next to workforce-api (8000).
      - "8001:8000"
    depends_on:
      workforce-db:
        condition: service_healthy

volumes:
  workforce_db_data:
